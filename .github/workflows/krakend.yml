name: Run krakend playbook
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ansible/roles/krakend/**
      - ansible/playbook/krakend.yaml
      - ansible/requirements.yml
      - .github/workflows/krakend.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Run playbook
      uses: dawidd6/action-ansible-playbook@v2
      with:
        playbook: playbook/krakend.yaml
        directory: ./ansible
        key: ${{secrets.SSH_PRIVATE_KEY}}
        vault_password: ${{secrets.VAULT_PASSWORD}}
        requirements: ./requirements.yml
        options: |
          -i inventory/base.ini
          --verbose
          --tags=krakend
      env:
        ANSIBLE_HOST_KEY_CHECKING: false
