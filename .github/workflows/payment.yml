name: Run payment playbook
on:
  workflow_dispatch:
  push:
    branches:
      - main 
    paths:
      - ansible/roles/payment/**          
      - submodules/bayeu/**
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure destination directory exists
        run: mkdir -p ansible/roles/payment/files/payment/volumes/functions/

      - name: Copy bayeu functions to payment ansible role
        run: |
          cp -r submodules/bayeu/supabase/functions/* ansible/roles/payment/files/payment/volumes/functions/

      - name: Run payment playbook
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: playbook/payment.yaml
          directory: ./ansible
          key: ${{secrets.SSH_PRIVATE_KEY}}
          vault_password: ${{secrets.VAULT_PASSWORD}}
          requirements: ./requirements.yml
          options: |
            -i inventory/base.ini
            --verbose        
            --tags=payment
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
  
