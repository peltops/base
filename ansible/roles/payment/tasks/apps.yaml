---
- name: copy payment files
  copy:
    src: ../files/payment
    dest: /opt

- name: deploy/restart payment apps 
  community.docker.docker_compose_v2:
    project_src: /opt/payment
    files: 
      - "docker-compose.yaml"
      - "docker-compose-s3.yaml"
    recreate: always
    state: present
  register: output

- name: Run dbmate migrations
  ansible.builtin.shell: docker start -a payment-dbmate

- name: Show results
  ansible.builtin.debug:
    var: output
