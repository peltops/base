---
- name: "Create directory"
  file:
    path: /opt/outpost
    state: directory

- name: copy outpost files
  copy:
    src: ../files/outpost
    dest: /opt

- name: deploy/restart outpost apps 
  community.docker.docker_compose_v2:
    project_src: /opt/outpost
    files: 
      - "docker-compose.yaml"
    state: present
  register: output

- name: Run outpost database migrations
  ansible.builtin.shell: docker compose run --rm outpost outpost migrate apply
  args:
    chdir: /opt/outpost

- name: Restart outpost after migrations
  ansible.builtin.shell: docker compose restart outpost
  args:
    chdir: /opt/outpost

- name: Show results
  ansible.builtin.debug:
    var: output
