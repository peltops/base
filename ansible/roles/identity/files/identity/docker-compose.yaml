x-logging:
  &default-logging
  driver: loki:latest
  options:
    loki-url: "https://${GRAFANA_USER}:${GRAFANA_TOKEN}@${GRAFANA_HOST}/loki/api/v1/push"
    loki-batch-size: 400

services:

  identity-db:
    image: postgres:15.17
    container_name: identity-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}  
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  
      POSTGRES_DB: ${POSTGRES_DATABASE}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5      

  identity-openldap:
    image: docker.io/bitnami/openldap:2.6
    container_name: identity-openldap
    logging: *default-logging
    environment:
      LDAP_ALLOW_ANON_BINDING: "no"
      LDAP_ADMIN_USERNAME:     ${LDAP_ADMIN_USERNAME}
      LDAP_ADMIN_PASSWORD:     ${LDAP_ADMIN_PASSWORD}
      LDAP_CUSTOM_LDIF_DIR:    /ldifs
      LDAP_ROOT:               ${LDAP_ROOT}
    restart: unless-stopped
    volumes:
      - ./ldifs:/ldifs:ro
      - ldap:/bitnami/openldap

  identity-keycloak:
    build: .
    image: peltops/pkeycloak:v0.4
    command: start --optimized
    container_name: identity-keycloak
    logging: *default-logging
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: identity-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${POSTGRES_DATABASE}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_DB_USERNAME: ${POSTGRES_USER}  
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    depends_on:
      identity-db:
        condition: service_healthy
      identity-openldap:
        condition: service_started
    volumes:
      - ./theme:/opt/keycloak/themes/theme:ro

volumes:
  db:
  ldap: