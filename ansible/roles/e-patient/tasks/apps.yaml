---
- name: copy e-patient files
  copy:
    src: ../files/e-patient
    dest: /opt

- name: deploy/restart e-patient apps 
  community.docker.docker_compose_v2:
    project_src: /opt/e-patient
    files: 
      - "docker-compose.yaml"
      - "docker-compose-s3.yaml"
    state: present
  register: output

- name: Show results
  ansible.builtin.debug:
    var: output
