---
- name: copy kasih files
  copy:
    src: ../files/kasih
    dest: /opt

- name: pull kasih images
  community.docker.docker_compose_v2_pull:
    project_src: /opt/kasih
    files:
      - "docker-compose.yaml"
      - "docker-compose-s3.yaml"
    policy: missing

- name: deploy/restart kasih apps 
  community.docker.docker_compose_v2:
    project_src: /opt/kasih
    files: 
      - "docker-compose.yaml"
      - "docker-compose-s3.yaml"
    state: present
  register: output

- name: Show results
  ansible.builtin.debug:
    var: output
