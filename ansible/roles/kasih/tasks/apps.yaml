---
- name: remove obsolete placeholder migration
  ansible.builtin.file:
    path: /opt/kasih/volumes/db/migrations/20261021150000_init.sql
    state: absent

- name: copy kasih files
  copy:
    src: ../files/kasih
    dest: /opt

- name: pull kasih images
  community.docker.docker_compose_v2_pull:
    project_src: /opt/kasih
    files:
      - "docker-compose.yaml"
      - "docker-compose-s3.yaml"
    policy: missing
    services:
      - studio
      - kong
      - auth
      - rest
      - realtime
      - storage
      - imgproxy
      - meta
      - functions
      - analytics
      - db
      - vector
      - supavisor
      - dbmate

- name: deploy/restart kasih apps 
  community.docker.docker_compose_v2:
    project_src: /opt/kasih
    files: 
      - "docker-compose.yaml"
      - "docker-compose-s3.yaml"
    state: present
  register: output

- name: Run dbmate migrations
  ansible.builtin.shell: docker start -a kasih-dbmate
  register: dbmate_result
  failed_when: dbmate_result.rc != 0 and "already running" not in dbmate_result.stderr
  changed_when: "'Applying' in dbmate_result.stdout or 'Applying' in dbmate_result.stderr"

- name: Show results
  ansible.builtin.debug:
    var: output
