server {
    listen      19443 ssl;
    server_name  kasih-app.peltops.com;
    include       /etc/nginx/config/common.conf;
    include       /etc/nginx/config/kasih-app.peltops.com.ssl.conf;

    root /var/www/static/kasih-app.peltops.com;

    location / {   
        try_files $uri $uri/ =404;
    }    
}
